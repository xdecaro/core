name: Core Release

on:
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml
          coverage: none

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$VERSION" = '2.2.0'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stop if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists. Bump VERSION before publishing changed files."
            exit 1
          fi

      - name: Build and validate
        run: bash build/build.sh

      - name: Synchronize canonical Joomla update checksum
        run: php build/update-feed-checksum.php

      - name: Synchronize legacy Joomla update bridge
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="dist/pkg_core_${VERSION}.zip"
          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          python3 - "$VERSION" "$SHA256" <<'PY'
          import sys, xml.etree.ElementTree as ET
          version, sha = sys.argv[1:3]
          path = 'updates/pkg_xdecarocore.xml'
          tree = ET.parse(path)
          update = tree.getroot().find('./update')
          update.find('version').text = version
          update.find('element').text = 'pkg_core'
          update.find('./downloads/downloadurl').text = f'https://github.com/xdecaro/core/releases/download/v{version}/pkg_core_{version}.zip'
          update.find('sha256').text = sha
          target = update.find('targetplatform')
          target.set('name', 'joomla')
          target.set('version', r'6\.1\.3')
          update.find('php_minimum').text = '8.3.0'
          ET.indent(tree, space='  ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          PY

      - name: Verify release checksum and package shape
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="dist/pkg_core_${VERSION}.zip"
          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          grep -q "<sha256>${SHA256}</sha256>" updates/pkg_core.xml
          grep -q "<sha256>${SHA256}</sha256>" updates/pkg_xdecarocore.xml
          grep -q "releases/download/v${VERSION}/pkg_core_${VERSION}.zip" updates/pkg_xdecarocore.xml
          grep -q '<element>pkg_core</element>' updates/pkg_xdecarocore.xml
          grep -q "${SHA256}  pkg_core_${VERSION}.zip" dist/SHA256SUMS.txt
          test -f "dist/lib_xdecarocore_${VERSION}.zip"
          test -f "dist/com_xdecarocore_${VERSION}.zip"
          test -f "dist/plg_system_xdecarocore_${VERSION}.zip"
          python3 - "$VERSION" <<'PY'
          import sys, zipfile
          v = sys.argv[1]
          with zipfile.ZipFile(f'dist/plg_system_xdecarocore_{v}.zip') as z:
              assert 'media/css/admin.css' in z.namelist()
              assert '"name": "xdecaro.admin"' in z.read('media/joomla.asset.json').decode()
          with zipfile.ZipFile(f'dist/com_xdecarocore_{v}.zip') as z:
              assert 'media/css/responsive.css' not in z.namelist()
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "dist/lib_xdecarocore_${VERSION}.zip" \
            "dist/com_xdecarocore_${VERSION}.zip" \
            "dist/plg_system_xdecarocore_${VERSION}.zip" \
            "dist/pkg_core_${VERSION}.zip" \
            dist/SHA256SUMS.txt \
            --title "Core ${VERSION}" \
            --notes "Core ${VERSION}: public opt-in xdecaro.admin UI layer for consistent responsive Joomla 6.1.3 administrator views. Canonical package identity remains pkg_core; PHP 8.3+ required."

      - name: Publish canonical and legacy update feeds
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_core.xml updates/pkg_xdecarocore.xml
          if git diff --cached --quiet; then
            echo "Update feeds already current."
            exit 0
          fi
          git commit -m "Publish update feeds for Core ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
