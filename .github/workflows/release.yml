name: Core Release

on:
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml
          coverage: none

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          case "$VERSION" in 2.1.*) ;; *) echo "Release workflow is locked to Core 2.1.x" >&2; exit 1;; esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stop if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists. Bump VERSION before publishing changed files."
            exit 1
          fi

      - name: Build and validate
        run: bash build/build.sh

      - name: Synchronize Joomla update checksum
        run: php build/update-feed-checksum.php

      - name: Verify release checksum and package shape
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="dist/pkg_core_${VERSION}.zip"
          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          grep -q "<sha256>${SHA256}</sha256>" updates/pkg_core.xml
          grep -q "${SHA256}  pkg_core_${VERSION}.zip" dist/SHA256SUMS.txt
          test -f "dist/lib_xdecarocore_${VERSION}.zip"
          test -f "dist/com_xdecarocore_${VERSION}.zip"
          test -f "dist/plg_system_xdecarocore_${VERSION}.zip"
          test ! -e "dist/lib_xdecarocorelegacy_${VERSION}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "dist/lib_xdecarocore_${VERSION}.zip" \
            "dist/com_xdecarocore_${VERSION}.zip" \
            "dist/plg_system_xdecarocore_${VERSION}.zip" \
            "dist/pkg_core_${VERSION}.zip" \
            dist/SHA256SUMS.txt \
            --title "Core ${VERSION}" \
            --notes "Core ${VERSION}: canonical Joomla package identity pkg_core, migration from pkg_xdecarocore, Joomla 6 / PHP 8.3. Child extension identifiers remain unchanged."

      - name: Publish update-feed checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_core.xml
          if git diff --cached --quiet; then
            echo "Update feed checksum already current."
            exit 0
          fi
          git commit -m "Publish SHA-256 for Core ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
