name: Core dashboard runtime

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'STABILIZATION_SERIES'
      - 'src/com_xdecarocore/**'
      - 'src/lib_xdecarocore/**'
      - 'src/lib_xdecarocorelegacy/**'
      - 'src/plg_system_xdecarocore/**'
      - 'package/**'
      - 'build/**'
      - 'tests/dashboard.php'
      - '.github/workflows/dashboard-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Joomla ${{ matrix.joomla }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5.4.8', '6.1.3']
        scenario: [clean, upgrade]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ startsWith(matrix.joomla, '6.') && '8.3' || '8.1' }}
          extensions: mysqli, zip, intl, mbstring, gd, simplexml
          coverage: none

      - name: Verify runner tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v curl >/dev/null
          command -v unzip >/dev/null
          command -v sha256sum >/dev/null

      - name: Build Core package
        run: bash build/build.sh

      - name: Download and verify Joomla
        shell: bash
        run: |
          set -euo pipefail
          JOOMLA='${{ matrix.joomla }}'
          case "$JOOMLA" in
            5.4.8) SHA='8d3585939bca8e6b1d5f3e97dda2cc557c61e610daf488c871e1f62a97be9bd0' ;;
            6.1.3) SHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1' ;;
            *) echo "Unsupported pinned Joomla version: $JOOMLA" >&2; exit 1 ;;
          esac
          FILE="Joomla_${JOOMLA}-Stable-Full_Package.zip"
          URL="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA}/${FILE}"
          curl --fail --location --retry 3 "$URL" --output /tmp/joomla.zip
          echo "${SHA}  /tmp/joomla.zip" | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla

      - name: Install Joomla
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install \
            --site-name='Core Dashboard Runtime' \
            --admin-user='Runtime Admin' \
            --admin-username='runtimeadmin' \
            --admin-password='Runtime-Only-12345!' \
            --admin-email='runtime@example.invalid' \
            --db-type='mysqli' \
            --db-host='127.0.0.1' \
            --db-user='root' \
            --db-pass='root' \
            --db-name='joomla' \
            --db-prefix='jos_'
          test -f configuration.php

      - name: Install current Core
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE="$GITHUB_WORKSPACE/dist/pkg_xdecarocore_${VERSION}.zip"
          test -f "$PACKAGE"
          cd joomla

          if [ '${{ matrix.scenario }}' = 'upgrade' ]; then
            curl --fail --location --retry 3 \
              'https://github.com/xdecaro/core/releases/download/v1.5.0/pkg_xdecarocore_1.5.0.zip' \
              --output /tmp/core-1.5.0.zip
            echo '4b76e86209823345813c8a56eb0e0526b9f13c7fab6d28ef5c53dc7a07e7e70f  /tmp/core-1.5.0.zip' | sha256sum --check --strict
            php cli/joomla.php extension:install --path=/tmp/core-1.5.0.zip
          fi

          php cli/joomla.php extension:install --path="$PACKAGE"
          php cli/joomla.php extension:list >/tmp/core-extensions.txt
          cat /tmp/core-extensions.txt

      - name: Verify installed extension records and administrator menu routes
        shell: bash
        run: |
          set -euo pipefail
          export CORE_VERSION="$(tr -d '[:space:]' < VERSION)"
          php -r '
            $version = (string) getenv("CORE_VERSION");
            $db = new mysqli("127.0.0.1", "root", "root", "joomla");
            if ($db->connect_errno) { fwrite(STDERR, $db->connect_error . PHP_EOL); exit(2); }
            $expected = [
              ["package", "pkg_xdecarocore", ""],
              ["library", "xdecaro/core", ""],
              ["library", "xdecaro/corelegacy", ""],
              ["component", "com_xdecarocore", ""],
              ["plugin", "xdecarocore", "system"],
            ];
            foreach ($expected as $item) {
              [$type, $element, $folder] = $item;
              $stmt = $db->prepare("SELECT extension_id, package_id, enabled, manifest_cache FROM jos_extensions WHERE type=? AND element=? AND folder=? LIMIT 1");
              $stmt->bind_param("sss", $type, $element, $folder);
              $stmt->execute();
              $result = $stmt->get_result();
              $row = $result->fetch_assoc();
              if (!$row) { fwrite(STDERR, "Missing extension: {$type} {$element} {$folder}\n"); exit(1); }
              $manifest = json_decode($row["manifest_cache"], true) ?: [];
              if (($manifest["version"] ?? "") !== $version) { fwrite(STDERR, "Unexpected version for {$element}\n"); exit(1); }
              if ($type === "plugin" && (int) $row["enabled"] !== 1) { fwrite(STDERR, "Core system plugin is disabled\n"); exit(1); }
            }

            $component = $db->query("SELECT extension_id, package_id FROM jos_extensions WHERE type=\"component\" AND element=\"com_xdecarocore\" LIMIT 1")->fetch_assoc();
            $package = $db->query("SELECT extension_id FROM jos_extensions WHERE type=\"package\" AND element=\"pkg_xdecarocore\" LIMIT 1")->fetch_assoc();
            if (!$component || !$package || (int) $component["package_id"] !== (int) $package["extension_id"]) {
              fwrite(STDERR, "Core administrator component is not linked to the package\n"); exit(1);
            }

            $componentId = (int) $component["extension_id"];
            $menuResult = $db->query("SELECT link FROM jos_menu WHERE client_id=1 AND component_id={$componentId}");
            $expectedLayouts = ["products", "extensions", "updates", "diagnostics", "information"];
            $foundLayouts = [];
            while ($menu = $menuResult->fetch_assoc()) {
              $link = (string) ($menu["link"] ?? "");
              if (strpos($link, "index.php?index.php?") !== false) {
                fwrite(STDERR, "Duplicated index.php? prefix remains in administrator menu: {$link}\n"); exit(1);
              }
              foreach ($expectedLayouts as $layout) {
                if (strpos($link, "option=com_xdecarocore") !== false && strpos($link, "layout={$layout}") !== false) {
                  $foundLayouts[$layout] = true;
                }
              }
            }
            foreach ($expectedLayouts as $layout) {
              if (empty($foundLayouts[$layout])) {
                fwrite(STDERR, "Missing normalized Core administrator submenu route: {$layout}\n"); exit(1);
              }
            }
            echo "Core {$version} extension records and administrator menu routes OK\n";
          '

      - name: Probe dashboard services through Joomla runtime
        shell: bash
        run: |
          set -euo pipefail
          export CORE_VERSION="$(tr -d '[:space:]' < VERSION)"
          cd joomla
          cat > core-dashboard-probe.php <<'PHP'
          <?php
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';

          $expectedVersion = (string) getenv('CORE_VERSION');
          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get(\Joomla\Console\Application::class);
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();

          if (!class_exists(\xdecaro\Core\Version::class) || \xdecaro\Core\Version::VERSION !== $expectedVersion) {
              fwrite(STDERR, "Current Core runtime class is unavailable.\n"); exit(1);
          }
          $component = $app->bootComponent('com_xdecarocore');
          if (!$component instanceof \Joomla\CMS\Extension\ComponentInterface) {
              fwrite(STDERR, "Core dashboard component did not boot.\n"); exit(1);
          }
          if (!class_exists(\xdecaro\Component\Core\Administrator\Service\EcosystemService::class)) {
              fwrite(STDERR, "EcosystemService is not autoloadable.\n"); exit(1);
          }
          $service = new \xdecaro\Component\Core\Administrator\Service\EcosystemService(
              $container->get(\Joomla\Database\DatabaseInterface::class)
          );
          $snapshot = $service->snapshot();
          $core = null;
          foreach ($snapshot['products'] ?? [] as $product) {
              if (($product['key'] ?? '') === 'core') { $core = $product; break; }
          }
          if (!$core || empty($core['installed']) || ($core['installed_version'] ?? '') !== $expectedVersion) {
              fwrite(STDERR, "Dashboard did not discover its own installed Core version.\n"); exit(1);
          }
          if (($core['status'] ?? '') !== 'current') {
              fwrite(STDERR, "Dashboard does not classify the installed Core release as current.\n"); exit(1);
          }
          if (($snapshot['summary']['technical_extensions'] ?? 0) < 5) {
              fwrite(STDERR, "Dashboard technical extension inventory is incomplete.\n"); exit(1);
          }
          echo "Core dashboard runtime discovery OK\n";
          PHP
          php core-dashboard-probe.php
          rm core-dashboard-probe.php
