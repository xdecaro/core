name: Core dashboard runtime

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'STABILIZATION_SERIES'
      - 'src/com_xdecarocore/**'
      - 'src/lib_xdecarocore/**'
      - 'src/plg_system_xdecarocore/**'
      - 'package/**'
      - 'build/**'
      - 'tests/**'
      - '.github/workflows/dashboard-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Joomla 6.1.3 / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        scenario: [clean, upgrade]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, intl, mbstring, gd, simplexml
          coverage: none

      - name: Build Core package
        run: bash build/build.sh

      - name: Download and verify Joomla 6.1.3
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/joomla/joomla-cms/releases/download/6.1.3/Joomla_6.1.3-Stable-Full_Package.zip' \
            --output /tmp/joomla.zip
          echo 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1  /tmp/joomla.zip' | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla

      - name: Install Joomla
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          ADMIN_PASS="Runtime-${GITHUB_RUN_ID}-Aa1!"
          php installation/joomla.php install \
            --site-name='Core Dashboard Runtime' \
            --admin-user='Runtime Admin' \
            --admin-username='runtimeadmin' \
            --admin-password="$ADMIN_PASS" \
            --admin-email='runtime@example.invalid' \
            --db-type='mysqli' --db-host='127.0.0.1' --db-user='root' --db-pass='root' \
            --db-name='joomla' --db-prefix='jos_'

      - name: Install Core
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE="$GITHUB_WORKSPACE/dist/pkg_core_${VERSION}.zip"
          cd joomla
          if [ '${{ matrix.scenario }}' = 'upgrade' ]; then
            curl --fail --location --retry 3 \
              'https://github.com/xdecaro/core/releases/download/v1.5.12/pkg_xdecarocore_1.5.12.zip' \
              --output /tmp/core-1.5.12.zip
            echo 'b354ebd8eaedf514f11843b8d62e7af5018e083b1c7c3ec43c82c3d2ebb5cdd8  /tmp/core-1.5.12.zip' | sha256sum --check --strict
            php cli/joomla.php extension:install --path=/tmp/core-1.5.12.zip -vvv
          fi
          php cli/joomla.php extension:install --path="$PACKAGE" -vvv

      - name: Verify Core 2.2 package records and shared UI assets
        shell: bash
        run: |
          set -euo pipefail
          export CORE_VERSION="$(tr -d '[:space:]' < VERSION)"
          php -r '
            $version = (string) getenv("CORE_VERSION");
            $db = new mysqli("127.0.0.1", "root", "root", "joomla");
            if ($db->connect_errno) { fwrite(STDERR, $db->connect_error . PHP_EOL); exit(2); }
            $expected = [
              ["package", "pkg_core", ""],
              ["library", "xdecaro/core", ""],
              ["component", "com_xdecarocore", ""],
              ["plugin", "xdecarocore", "system"],
            ];
            foreach ($expected as [$type, $element, $folder]) {
              $stmt = $db->prepare("SELECT extension_id, package_id, enabled, manifest_cache FROM jos_extensions WHERE type=? AND element=? AND folder=? LIMIT 1");
              $stmt->bind_param("sss", $type, $element, $folder);
              $stmt->execute();
              $row = $stmt->get_result()->fetch_assoc();
              if (!$row) { fwrite(STDERR, "Missing extension: {$type} {$element}\n"); exit(1); }
              $manifest = json_decode($row["manifest_cache"], true) ?: [];
              if (($manifest["version"] ?? "") !== $version) { fwrite(STDERR, "Wrong version: {$element}\n"); exit(1); }
              if ($type === "plugin" && (int) $row["enabled"] !== 1) { fwrite(STDERR, "Core plugin disabled\n"); exit(1); }
            }
            $legacy = $db->query("SELECT COUNT(*) AS total FROM jos_extensions WHERE type=\"package\" AND element=\"pkg_xdecarocore\"")->fetch_assoc();
            if ((int) ($legacy["total"] ?? -1) !== 0) { fwrite(STDERR, "Legacy Core package registration still installed\n"); exit(1); }
          '

          test -f joomla/media/plg_system_xdecarocore/css/core.css
          test -f joomla/media/plg_system_xdecarocore/css/components.css
          test -f joomla/media/plg_system_xdecarocore/css/admin.css
          test -f joomla/media/plg_system_xdecarocore/joomla.asset.json
          grep -Fq '"name": "xdecaro.admin"' joomla/media/plg_system_xdecarocore/joomla.asset.json
          grep -Fq '"dependencies": ["xdecaro.components"]' joomla/media/plg_system_xdecarocore/joomla.asset.json

          test -f joomla/media/com_xdecarocore/css/admin.css
          test -f joomla/media/com_xdecarocore/js/admin.js
          test ! -e joomla/media/com_xdecarocore/css/responsive.css
          ! grep -Fq 'com_xdecarocore.responsive' joomla/media/com_xdecarocore/joomla.asset.json

      - name: Probe Core public UI and runtime API
        shell: bash
        run: |
          set -euo pipefail
          export CORE_VERSION="$(tr -d '[:space:]' < VERSION)"
          cd joomla
          cat > core-dashboard-probe.php <<'PHP'
          <?php
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';

          $expectedVersion = (string) getenv('CORE_VERSION');
          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get(\Joomla\Console\Application::class);
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();

          if (!class_exists(\xdecaro\Core\Version::class) || \xdecaro\Core\Version::VERSION !== $expectedVersion) exit(1);
          if (!class_exists(\xdecaro\Core\Asset\AssetService::class)) exit(1);
          if (\xdecaro\Core\Asset\AssetService::STYLE_ADMIN !== 'xdecaro.admin') exit(1);
          if (!class_exists(\xdecaro\Core\Location\WorldLocationService::class)) exit(1);
          if (!class_exists(\xdecaro\Plugin\System\Core\Extension\CorePlugin::class)) exit(1);

          $component = $app->bootComponent('com_xdecarocore');
          if (!$component instanceof \Joomla\CMS\Extension\ComponentInterface) exit(1);
          echo "Core dashboard {$expectedVersion} shared UI runtime OK\n";
          PHP
          php core-dashboard-probe.php
          rm core-dashboard-probe.php
