name: Core dashboard runtime

on:
  pull_request:
    paths:
      - 'VERSION'
      - 'STABILIZATION_SERIES'
      - 'src/com_xdecarocore/**'
      - 'src/lib_xdecarocore/**'
      - 'src/lib_xdecarocorelegacy/**'
      - 'src/plg_system_xdecarocore/**'
      - 'package/**'
      - 'build/**'
      - 'tests/dashboard.php'
      - '.github/workflows/dashboard-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Joomla ${{ matrix.joomla }} / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5.4.8', '6.1.3']
        scenario: [clean, upgrade]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ startsWith(matrix.joomla, '6.') && '8.3' || '8.1' }}
          extensions: mysqli, zip, intl, mbstring, gd, simplexml
          coverage: none

      - name: Build Core package
        run: bash build/build.sh

      - name: Download and verify Joomla
        shell: bash
        run: |
          set -euo pipefail
          JOOMLA='${{ matrix.joomla }}'
          case "$JOOMLA" in
            5.4.8) SHA='8d3585939bca8e6b1d5f3e97dda2cc557c61e610daf488c871e1f62a97be9bd0' ;;
            6.1.3) SHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1' ;;
            *) echo "Unsupported Joomla version: $JOOMLA" >&2; exit 1 ;;
          esac
          FILE="Joomla_${JOOMLA}-Stable-Full_Package.zip"
          curl --fail --location --retry 3 \
            "https://github.com/joomla/joomla-cms/releases/download/${JOOMLA}/${FILE}" \
            --output /tmp/joomla.zip
          echo "${SHA}  /tmp/joomla.zip" | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla

      - name: Install Joomla
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          ADMIN_PASS="Runtime-${GITHUB_RUN_ID}-Aa1!"
          php installation/joomla.php install \
            --site-name='Core Dashboard Runtime' \
            --admin-user='Runtime Admin' \
            --admin-username='runtimeadmin' \
            --admin-password="$ADMIN_PASS" \
            --admin-email='runtime@example.invalid' \
            --db-type='mysqli' \
            --db-host='127.0.0.1' \
            --db-user='root' \
            --db-pass='root' \
            --db-name='joomla' \
            --db-prefix='jos_'
          test -f configuration.php

      - name: Install Core
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          PACKAGE="$GITHUB_WORKSPACE/dist/pkg_xdecarocore_${VERSION}.zip"
          test -f "$PACKAGE"
          cd joomla

          if [ '${{ matrix.scenario }}' = 'upgrade' ]; then
            curl --fail --location --retry 3 \
              'https://github.com/xdecaro/core/releases/download/v1.5.8/pkg_xdecarocore_1.5.8.zip' \
              --output /tmp/core-1.5.8.zip
            echo '1396fac59a8097a7c65d4ae246422a936b9c8f9e1402719d99f2503ac1a3a8ed  /tmp/core-1.5.8.zip' | sha256sum --check --strict
            php cli/joomla.php extension:install --path=/tmp/core-1.5.8.zip
          fi

          php cli/joomla.php extension:install --path="$PACKAGE"

      - name: Verify installed records and dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          export CORE_VERSION="$(tr -d '[:space:]' < VERSION)"
          php -r '
            $version = (string) getenv("CORE_VERSION");
            $db = new mysqli("127.0.0.1", "root", "root", "joomla");
            if ($db->connect_errno) { fwrite(STDERR, $db->connect_error . PHP_EOL); exit(2); }
            $expected = [
              ["package", "pkg_xdecarocore", ""],
              ["library", "xdecaro/core", ""],
              ["library", "xdecaro/corelegacy", ""],
              ["component", "com_xdecarocore", ""],
              ["plugin", "xdecarocore", "system"],
            ];
            foreach ($expected as [$type, $element, $folder]) {
              $stmt = $db->prepare("SELECT extension_id, package_id, enabled, manifest_cache FROM jos_extensions WHERE type=? AND element=? AND folder=? LIMIT 1");
              $stmt->bind_param("sss", $type, $element, $folder);
              $stmt->execute();
              $row = $stmt->get_result()->fetch_assoc();
              if (!$row) { fwrite(STDERR, "Missing extension: {$type} {$element}\n"); exit(1); }
              $manifest = json_decode($row["manifest_cache"], true) ?: [];
              if (($manifest["version"] ?? "") !== $version) { fwrite(STDERR, "Wrong version: {$element}\n"); exit(1); }
              if ($type === "plugin" && (int) $row["enabled"] !== 1) { fwrite(STDERR, "Core plugin disabled\n"); exit(1); }
            }
            $component = $db->query("SELECT extension_id, package_id FROM jos_extensions WHERE type=\"component\" AND element=\"com_xdecarocore\" LIMIT 1")->fetch_assoc();
            $package = $db->query("SELECT extension_id FROM jos_extensions WHERE type=\"package\" AND element=\"pkg_xdecarocore\" LIMIT 1")->fetch_assoc();
            if (!$component || !$package || (int) $component["package_id"] !== (int) $package["extension_id"]) {
              fwrite(STDERR, "Core component/package link invalid\n"); exit(1);
            }
            $componentId = (int) $component["extension_id"];
            $menuResult = $db->query("SELECT link FROM jos_menu WHERE client_id=1 AND component_id={$componentId}");
            $expectedLayouts = ["products", "extensions", "updates", "diagnostics", "information"];
            $found = [];
            while ($menu = $menuResult->fetch_assoc()) {
              $link = (string) ($menu["link"] ?? "");
              if (strpos($link, "index.php?index.php?") !== false) { fwrite(STDERR, "Duplicated administrator route\n"); exit(1); }
              foreach ($expectedLayouts as $layout) {
                if (strpos($link, "option=com_xdecarocore") !== false && strpos($link, "layout={$layout}") !== false) $found[$layout] = true;
              }
            }
            foreach ($expectedLayouts as $layout) {
              if (empty($found[$layout])) { fwrite(STDERR, "Missing submenu: {$layout}\n"); exit(1); }
            }
          '

          test -f joomla/administrator/components/com_xdecarocore/config.xml
          test -f joomla/administrator/components/com_xdecarocore/tmpl/dashboard/guide.php
          test -f joomla/media/com_xdecarocore/css/admin.css
          test -f joomla/media/com_xdecarocore/css/responsive.css
          test -f joomla/media/com_xdecarocore/js/admin.js
          grep -Fq '"uri": "com_xdecarocore/admin.css"' joomla/media/com_xdecarocore/joomla.asset.json
          grep -Fq '"uri": "com_xdecarocore/responsive.css"' joomla/media/com_xdecarocore/joomla.asset.json
          grep -Fq '"uri": "com_xdecarocore/admin.js"' joomla/media/com_xdecarocore/joomla.asset.json
          ! grep -Fq 'com_xdecarocore/css/admin.css' joomla/media/com_xdecarocore/joomla.asset.json
          ! grep -Fq 'com_xdecarocore/css/responsive.css' joomla/media/com_xdecarocore/joomla.asset.json
          ! grep -Fq 'com_xdecarocore/js/admin.js' joomla/media/com_xdecarocore/joomla.asset.json
          grep -Fq 'container-name: xdecaro-suite' joomla/media/com_xdecarocore/css/admin.css
          grep -Fq '@container xdecaro-suite (max-width: 55rem)' joomla/media/com_xdecarocore/css/responsive.css
          grep -Fq 'padding: var(--xdecaro-space-3, 0.75rem);' joomla/media/com_xdecarocore/css/responsive.css
          grep -Fq 'safe-area-inset-top' joomla/media/com_xdecarocore/css/responsive.css
          grep -Fq 'safe-area-inset-bottom' joomla/media/com_xdecarocore/css/responsive.css

      - name: Probe dashboard through Joomla runtime
        shell: bash
        run: |
          set -euo pipefail
          export CORE_VERSION="$(tr -d '[:space:]' < VERSION)"
          cd joomla
          cat > core-dashboard-probe.php <<'PHP'
          <?php
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';

          $expectedVersion = (string) getenv('CORE_VERSION');
          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get(\Joomla\Console\Application::class);
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();

          if (!class_exists(\xdecaro\Core\Version::class) || \xdecaro\Core\Version::VERSION !== $expectedVersion) exit(1);
          $component = $app->bootComponent('com_xdecarocore');
          if (!$component instanceof \Joomla\CMS\Extension\ComponentInterface) exit(1);
          $service = new \xdecaro\Component\Core\Administrator\Service\EcosystemService(
              $container->get(\Joomla\Database\DatabaseInterface::class)
          );
          $snapshot = $service->snapshot();
          $core = null;
          $feedback = null;
          foreach ($snapshot['products'] ?? [] as $product) {
              if (($product['key'] ?? '') === 'core') $core = $product;
              if (($product['key'] ?? '') === 'feedback') $feedback = $product;
          }
          if (!$core || ($core['installed_version'] ?? '') !== $expectedVersion || ($core['status'] ?? '') !== 'current') exit(1);
          if (count($core['children'] ?? []) !== 4) exit(1);
          if (!$feedback || ($feedback['status'] ?? '') !== 'planned' || ($feedback['available_version'] ?? '') !== '') exit(1);

          $registry = json_decode((string) file_get_contents(JPATH_ROOT . '/media/com_xdecarocore/joomla.asset.json'), true);
          $assets = [];
          foreach (($registry['assets'] ?? []) as $asset) {
              $name = (string) ($asset['name'] ?? '');
              $type = (string) ($asset['type'] ?? '');
              if ($name !== '' && $type !== '') $assets[$name . ':' . $type] = $asset['uri'] ?? '';
          }
          if (($assets['com_xdecarocore.admin:style'] ?? '') !== 'com_xdecarocore/admin.css') exit(1);
          if (($assets['com_xdecarocore.responsive:style'] ?? '') !== 'com_xdecarocore/responsive.css') exit(1);
          if (($assets['com_xdecarocore.admin:script'] ?? '') !== 'com_xdecarocore/admin.js') exit(1);
          echo "Core dashboard runtime, guide, Feedback catalog and responsive assets OK\n";
          PHP
          php core-dashboard-probe.php
          rm core-dashboard-probe.php
