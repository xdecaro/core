name: Joomla runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runtime-smoke.yml'
      - 'STABILIZATION_SERIES'
      - 'docs/runtime-validation-matrix.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-smoke.yml'
      - 'STABILIZATION_SERIES'

permissions:
  contents: read

jobs:
  package-runtime:
    name: Joomla ${{ matrix.joomla }} / ${{ matrix.product }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5', '6']
        product: [core, courses, forms, competitions, documents, membership, events, editor, finance, protocol]
        exclude:
          - joomla: '5'
            product: editor
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.joomla == '6' && '8.3' || '8.1' }}
          extensions: mysqli, zip, intl, mbstring, gd
          coverage: none

      - name: Install tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq unzip curl

      - name: Resolve latest stable Joomla package for major
        id: joomla
        shell: bash
        run: |
          set -euo pipefail
          MAJOR='${{ matrix.joomla }}'
          RELEASES="$(curl -fsSL 'https://api.github.com/repos/joomla/joomla-cms/releases?per_page=100')"
          URL="$(printf '%s' "$RELEASES" | jq -r --arg major "$MAJOR" '
            [ .[]
              | select(.draft == false)
              | select(.tag_name | startswith($major + "."))
              | select((.tag_name | test("alpha|beta|rc"; "i")) | not)
            ][0].assets[]
            | select(.name | test("Stable-Full_Package\\.zip$"))
            | .browser_download_url
          ' | head -n1)"
          test -n "$URL" && test "$URL" != null
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Resolved Joomla $MAJOR package: $URL"

      - name: Install Joomla
        shell: bash
        run: |
          set -euo pipefail
          mkdir joomla
          curl -fL '${{ steps.joomla.outputs.url }}' -o /tmp/joomla.zip
          unzip -q /tmp/joomla.zip -d joomla
          cd joomla
          php installation/joomla.php install \
            --site-name='Xdecaro Runtime Smoke' \
            --admin-user='Runtime Admin' \
            --admin-username='runtimeadmin' \
            --admin-password='Runtime-Only-12345!' \
            --admin-email='runtime@example.invalid' \
            --db-type='mysqli' \
            --db-host='127.0.0.1' \
            --db-user='root' \
            --db-pass='root' \
            --db-name='joomla' \
            --db-prefix='jos_'
          test -f configuration.php
          php cli/joomla.php extension:list >/tmp/extensions-before.txt

      - name: Resolve and download released package
        id: product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT='${{ matrix.product }}'
          case "$PRODUCT" in
            core)
              URL='https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip'; MODE='core' ;;
            courses)
              URL='https://github.com/xdecaro/courses/releases/download/v1.3.0/pkg_decarocourses_1.3.0.zip'; MODE='optional' ;;
            forms)
              URL='https://github.com/xdecaro/forms/releases/download/v1.6.0/pkg_decaroforms_1.6.0.zip'; MODE='optional' ;;
            competitions)
              URL='https://github.com/xdecaro/competitions/releases/download/v1.1.0/pkg_xdecarocompetitions_1.1.0.zip'; MODE='optional' ;;
            documents)
              URL='https://github.com/xdecaro/documents/releases/download/v1.1.0/pkg_decarodocuments_1.1.0.zip'; MODE='hard' ;;
            membership)
              URL='https://github.com/xdecaro/membership/releases/download/v1.2.0/pkg_decaromembership_1.2.0.zip'; MODE='optional' ;;
            events)
              URL='https://github.com/xdecaro/events/releases/download/v1.1.0/pkg_decaroevents_1.1.0.zip'; MODE='hard' ;;
            editor)
              URL='https://github.com/xdecaro/editor/releases/download/v0.1.0-alpha4/pkg_decaroeditor_0.1.0-alpha4.zip'; MODE='optional' ;;
            finance)
              URL='https://github.com/xdecaro/finance/releases/download/v1.1.0/pkg_decarofinance_1.1.0.zip'; MODE='optional' ;;
            protocol)
              URL='https://github.com/xdecaro/protocol/releases/download/v1.2.0/pkg_decaroprotocol_1.2.0.zip'; MODE='optional' ;;
            *) echo "Unknown product: $PRODUCT" >&2; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -fL "$URL" -o /tmp/product.zip
          curl -fL 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' -o /tmp/core.zip
          unzip -t /tmp/product.zip >/dev/null
          unzip -t /tmp/core.zip >/dev/null

      - name: Verify optional/hard dependency installation behavior
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          MODE='${{ steps.product.outputs.mode }}'
          PRODUCT='${{ matrix.product }}'

          if [ "$MODE" = 'core' ]; then
            php cli/joomla.php extension:install --path=/tmp/core.zip
          elif [ "$MODE" = 'optional' ]; then
            php cli/joomla.php extension:install --path=/tmp/product.zip
            php cli/joomla.php extension:list >/tmp/extensions-without-core.txt
            php cli/joomla.php extension:install --path=/tmp/core.zip
          elif [ "$MODE" = 'hard' ]; then
            set +e
            php cli/joomla.php extension:install --path=/tmp/product.zip >/tmp/hard-before-core.log 2>&1
            STATUS=$?
            set -e
            if [ "$STATUS" -eq 0 ]; then
              cat /tmp/hard-before-core.log
              echo "$PRODUCT unexpectedly installed without Core." >&2
              exit 1
            fi
            php cli/joomla.php extension:install --path=/tmp/core.zip
            php cli/joomla.php extension:install --path=/tmp/product.zip
          else
            echo "Unknown Core mode: $MODE" >&2
            exit 1
          fi

          php cli/joomla.php extension:list >/tmp/extensions-final.txt

      - name: Probe canonical Core runtime
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          cat > core-probe.php <<'PHP'
          <?php
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';
          if (!class_exists(\xdecaro\Core\Version::class)) {
              fwrite(STDERR, "Canonical Core Version class is not autoloadable.\n");
              exit(1);
          }
          if (version_compare((string) \xdecaro\Core\Version::VERSION, '1.4.0', '<')) {
              fwrite(STDERR, "Unexpected Core version.\n");
              exit(1);
          }
          if (!class_exists(\xdecaro\Core\Integration\CapabilityRegistry::class)) {
              fwrite(STDERR, "CapabilityRegistry is not autoloadable.\n");
              exit(1);
          }
          echo 'Core runtime ' . \xdecaro\Core\Version::VERSION . " OK\n";
          PHP
          php core-probe.php
          rm core-probe.php

  core-upgrade:
    name: Joomla ${{ matrix.joomla }} / Core 1.3.0 -> 1.4.0
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5', '6']
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.joomla == '6' && '8.3' || '8.1' }}
          extensions: mysqli, zip, intl, mbstring, gd
          coverage: none
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq jq unzip curl
      - name: Resolve and install Joomla
        shell: bash
        run: |
          set -euo pipefail
          MAJOR='${{ matrix.joomla }}'
          RELEASES="$(curl -fsSL 'https://api.github.com/repos/joomla/joomla-cms/releases?per_page=100')"
          URL="$(printf '%s' "$RELEASES" | jq -r --arg major "$MAJOR" '[.[] | select(.draft == false) | select(.tag_name | startswith($major + ".")) | select((.tag_name | test("alpha|beta|rc"; "i")) | not)][0].assets[] | select(.name | test("Stable-Full_Package\\.zip$")) | .browser_download_url' | head -n1)"
          test -n "$URL" && test "$URL" != null
          mkdir joomla
          curl -fL "$URL" -o /tmp/joomla.zip
          unzip -q /tmp/joomla.zip -d joomla
          cd joomla
          php installation/joomla.php install --site-name='Core Upgrade Smoke' --admin-user='Runtime Admin' --admin-username='runtimeadmin' --admin-password='Runtime-Only-12345!' --admin-email='runtime@example.invalid' --db-type='mysqli' --db-host='127.0.0.1' --db-user='root' --db-pass='root' --db-name='joomla' --db-prefix='jos_'
      - name: Install old then current Core
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://github.com/xdecaro/core/releases/download/v1.3.0/pkg_xdecarocore_1.3.0.zip' -o /tmp/core-1.3.0.zip
          curl -fL 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' -o /tmp/core-1.4.0.zip
          cd joomla
          php cli/joomla.php extension:install --path=/tmp/core-1.3.0.zip
          php cli/joomla.php extension:install --path=/tmp/core-1.4.0.zip
          php cli/joomla.php extension:list >/tmp/core-upgrade-final.txt
