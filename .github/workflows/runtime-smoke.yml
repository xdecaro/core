name: Joomla runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runtime-smoke.yml'
      - 'src/**'
      - 'package/**'
      - 'build/**'
      - 'tests/**'
      - 'VERSION'
      - 'STABILIZATION_SERIES'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-smoke.yml'
      - 'src/**'
      - 'package/**'
      - 'build/**'
      - 'VERSION'
      - 'STABILIZATION_SERIES'

permissions:
  contents: read

jobs:
  package-runtime:
    name: Joomla 6.1.3 / ${{ matrix.product }} with current Core
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        product: [core, courses, forms, competitions, documents, membership, events, editor, finance, protocol]

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, intl, mbstring, gd, simplexml
          coverage: none

      - name: Build current Core
        run: bash build/build.sh

      - name: Download and verify Joomla 6.1.3
        shell: bash
        run: |
          set -euo pipefail
          JOOMLA='6.1.3'
          SHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1'
          FILE="Joomla_${JOOMLA}-Stable-Full_Package.zip"
          curl --fail --location --retry 3 "https://github.com/joomla/joomla-cms/releases/download/${JOOMLA}/${FILE}" --output /tmp/joomla.zip
          echo "${SHA}  /tmp/joomla.zip" | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla

      - name: Install Joomla
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install \
            --site-name='Xdecaro Core 2 Runtime' \
            --admin-user='Runtime Admin' \
            --admin-username='runtimeadmin' \
            --admin-password='Runtime-Only-12345!' \
            --admin-email='runtime@example.invalid' \
            --db-type='mysqli' \
            --db-host='127.0.0.1' \
            --db-user='root' \
            --db-pass='root' \
            --db-name='joomla' \
            --db-prefix='jos_'

      - name: Install current Core 2.0.x
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd joomla
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_xdecarocore_${VERSION}.zip" -vvv

      - name: Download selected ecosystem product
        if: matrix.product != 'core'
        id: product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT='${{ matrix.product }}'
          case "$PRODUCT" in
            courses)
              URL='https://raw.githubusercontent.com/xdecaro/courses/main/releases/1.5.0/pkg_decarocourses_1.5.0.zip'; SHA='fe3eca7a18590c1c9ba4b983f83e975a2b4b30874952a4f372b0f72d26073ea0'; ELEMENT='pkg_decarocourses' ;;
            forms)
              URL='https://raw.githubusercontent.com/xdecaro/forms/main/releases/1.7.0/pkg_decaroforms_1.7.0.zip'; SHA='f7fa1987abe73efd614978a0746ba8850e87e3f1a7100abd62f4cb9dec3b90b4'; ELEMENT='pkg_decaroforms' ;;
            competitions)
              URL='https://github.com/xdecaro/competitions/releases/download/v1.3.0/pkg_xdecarocompetitions_1.3.0.zip'; SHA='7ab39b59ebddc122c21d689b40cd17e408c9520b6bf4f3efc4386454136a90ab'; ELEMENT='pkg_xdecarocompetitions' ;;
            documents)
              URL='https://github.com/xdecaro/documents/releases/download/v1.2.2/pkg_decarodocuments_1.2.2.zip'; SHA='0b82aef86ffd094cc2453e129e285bfb6274d08c930453a519fbf876e641114f'; ELEMENT='pkg_decarodocuments' ;;
            membership)
              URL='https://github.com/xdecaro/membership/releases/download/v1.4.0/pkg_decaromembership_1.4.0.zip'; SHA='0399497475e4d0e82c15120758ecd635f387dd5bdf7cf8b007dd5bb6b940413b'; ELEMENT='pkg_decaromembership' ;;
            events)
              URL='https://github.com/xdecaro/events/releases/download/v1.2.0/pkg_decaroevents_1.2.0.zip'; SHA='822c9498a44f2353cd52af4027319e793b6b222969c8af30a4b908daeca2ffef'; ELEMENT='pkg_decaroevents' ;;
            editor)
              URL='https://github.com/xdecaro/editor/releases/download/v0.1.0-alpha6/pkg_decaroeditor_0.1.0-alpha6.zip'; SHA='6ece2b5330321e0e2dbc2ac7c388d0cc2e24d977cd415dccc9cc0a922dece616'; ELEMENT='pkg_decaroeditor' ;;
            finance)
              URL='https://github.com/xdecaro/finance/releases/download/v1.3.0/pkg_decarofinance_1.3.0.zip'; SHA='9659b3325960a65126f24a9d8906e3fa02db88198d369367e086d36265255c6c'; ELEMENT='pkg_decarofinance' ;;
            protocol)
              URL='https://github.com/xdecaro/protocol/releases/download/v1.4.0/pkg_decaroprotocol_1.4.0.zip'; SHA='2f762928fb2944611356b3568643700eb0af1af6a0be65fcfd0f3b287431eef9'; ELEMENT='pkg_decaroprotocol' ;;
            *) echo "Unknown product: $PRODUCT" >&2; exit 1 ;;
          esac
          curl --fail --location --retry 3 "$URL" --output /tmp/product.zip
          echo "${SHA}  /tmp/product.zip" | sha256sum --check --strict
          unzip -t /tmp/product.zip >/dev/null
          echo "element=$ELEMENT" >> "$GITHUB_OUTPUT"

      - name: Install selected ecosystem product
        if: matrix.product != 'core'
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php cli/joomla.php extension:install --path=/tmp/product.zip -vvv
          ELEMENT='${{ steps.product.outputs.element }}'
          COUNT="$(php -r '$db=new mysqli("127.0.0.1","root","root","joomla"); $s=$db->prepare("SELECT COUNT(*) FROM jos_extensions WHERE element=?"); $e=$argv[1]; $s->bind_param("s",$e); $s->execute(); $s->bind_result($c); $s->fetch(); echo (int)$c;' "$ELEMENT")"
          test "$COUNT" -eq 1

      - name: Probe Core 2.x runtime
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd joomla
          cat > core-probe.php <<'PHP'
          <?php
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';

          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get(\Joomla\Console\Application::class);
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();

          $expected = $argv[1];
          if (!class_exists(\xdecaro\Core\Version::class) || \xdecaro\Core\Version::VERSION !== $expected) {
              fwrite(STDERR, "Unexpected Core runtime version.\n"); exit(1);
          }
          foreach ([
              \xdecaro\Core\Integration\EntityReference::class,
              \xdecaro\Core\Integration\CapabilityRegistry::class,
              \xdecaro\Core\Location\LocationProviderInterface::class,
              \xdecaro\Core\Location\LocationResult::class,
              \xdecaro\Core\Location\WorldLocationService::class,
              \xdecaro\Plugin\System\Core\Extension\CorePlugin::class,
          ] as $class) {
              if (!class_exists($class) && !interface_exists($class)) {
                  fwrite(STDERR, "Core class is not autoloadable: {$class}\n"); exit(1);
              }
          }
          echo "Core {$expected} runtime OK\n";
          PHP
          php core-probe.php "$VERSION"
          rm core-probe.php

  upgrade-from-1-5-12:
    name: Joomla 6.1.3 / Core 1.5.12 -> current 2.0.x
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, intl, mbstring, gd, simplexml
          coverage: none

      - name: Build current Core
        run: bash build/build.sh

      - name: Download pinned Joomla and Core 1.5.12
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/joomla/joomla-cms/releases/download/6.1.3/Joomla_6.1.3-Stable-Full_Package.zip' --output /tmp/joomla.zip
          echo 'a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1  /tmp/joomla.zip' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://github.com/xdecaro/core/releases/download/v1.5.12/pkg_xdecarocore_1.5.12.zip' --output /tmp/core-old.zip
          echo 'b354ebd8eaedf514f11843b8d62e7af5018e083b1c7c3ec43c82c3d2ebb5cdd8  /tmp/core-old.zip' | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla

      - name: Install Joomla and Core 1.5.12
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install \
            --site-name='Core Upgrade CI' \
            --admin-user='Runtime Admin' \
            --admin-username='runtimeadmin' \
            --admin-password='Runtime-Only-12345!' \
            --admin-email='runtime@example.invalid' \
            --db-type='mysqli' --db-host='127.0.0.1' --db-user='root' --db-pass='root' --db-name='joomla' --db-prefix='jos_'
          php cli/joomla.php extension:install --path=/tmp/core-old.zip -vvv
          mysql -h127.0.0.1 -uroot -proot joomla -Nse "SELECT COUNT(*) FROM jos_extensions WHERE type='library' AND element='xdecaro/corelegacy'" | grep -Fxq '1'

      - name: Upgrade to current Core 2.0.x
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          cd joomla
          php cli/joomla.php extension:install --path="$GITHUB_WORKSPACE/dist/pkg_xdecarocore_${VERSION}.zip" -vvv
          mysql -h127.0.0.1 -uroot -proot joomla -Nse "SELECT COUNT(*) FROM jos_extensions WHERE type='library' AND element='xdecaro/corelegacy'" | grep -Fxq '0'
          mysql -h127.0.0.1 -uroot -proot joomla -Nse "SELECT COUNT(*) FROM jos_extensions WHERE type='plugin' AND folder='system' AND element='xdecarocore' AND enabled=1" | grep -Fxq '1'
          php cli/joomla.php extension:list >/tmp/extensions-after-upgrade.txt
