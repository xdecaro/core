name: Joomla runtime smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/runtime-smoke.yml'
      - 'STABILIZATION_SERIES'
      - 'docs/runtime-validation-matrix.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-smoke.yml'
      - 'STABILIZATION_SERIES'

permissions:
  contents: read

jobs:
  package-runtime:
    name: Joomla ${{ matrix.joomla }} / ${{ matrix.product }}
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5.4.8', '6.1.3']
        product: [core, courses, forms, competitions, documents, membership, events, editor, finance, protocol]
        exclude:
          # These released packages currently declare Joomla 6 / PHP 8.3 only.
          - joomla: '5.4.8'
            product: courses
          - joomla: '5.4.8'
            product: forms
          - joomla: '5.4.8'
            product: competitions
          - joomla: '5.4.8'
            product: editor
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ startsWith(matrix.joomla, '6.') && '8.3' || '8.1' }}
          extensions: mysqli, zip, intl, mbstring, gd
          coverage: none

      - name: Install tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip curl

      - name: Download and verify pinned Joomla package
        shell: bash
        run: |
          set -euo pipefail
          JOOMLA='${{ matrix.joomla }}'
          case "$JOOMLA" in
            5.4.8) SHA='8d3585939bca8e6b1d5f3e97dda2cc557c61e610daf488c871e1f62a97be9bd0' ;;
            6.1.3) SHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1' ;;
            *) echo "Unsupported pinned Joomla version: $JOOMLA" >&2; exit 1 ;;
          esac
          FILE="Joomla_${JOOMLA}-Stable-Full_Package.zip"
          URL="https://github.com/joomla/joomla-cms/releases/download/${JOOMLA}/${FILE}"
          curl --fail --location --retry 3 "$URL" --output /tmp/joomla.zip
          echo "${SHA}  /tmp/joomla.zip" | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla

      - name: Install Joomla
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          php installation/joomla.php install \
            --site-name='Xdecaro Runtime Smoke' \
            --admin-user='Runtime Admin' \
            --admin-username='runtimeadmin' \
            --admin-password='Runtime-Only-12345!' \
            --admin-email='runtime@example.invalid' \
            --db-type='mysqli' \
            --db-host='127.0.0.1' \
            --db-user='root' \
            --db-pass='root' \
            --db-name='joomla' \
            --db-prefix='jos_'
          test -f configuration.php
          php cli/joomla.php extension:list >/tmp/extensions-before.txt

      - name: Resolve download and verify distributed package
        id: product
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT='${{ matrix.product }}'
          case "$PRODUCT" in
            core)
              URL='https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip'; SHA='4248f7e3de514c2ae2402ffc8ba12845647dca1ebac963da370650e88ac45def'; MODE='core'; PACKAGE='pkg_xdecarocore'; COMPONENT='' ;;
            courses)
              URL='https://raw.githubusercontent.com/xdecaro/courses/main/releases/1.3.0/pkg_decarocourses_1.3.0.zip'; SHA='e1429f9189e6e9c21b98d05b6cb597e3b957fee7f0f3911c1607165b639cb22c'; MODE='optional'; PACKAGE='pkg_decarocourses'; COMPONENT='' ;;
            forms)
              URL='https://raw.githubusercontent.com/xdecaro/forms/main/releases/1.6.0/pkg_decaroforms_1.6.0.zip'; SHA='5e7df40f442444eb0e12bb4f1441cd7bc53549f458273f94879f6304f266e286'; MODE='optional'; PACKAGE='pkg_decaroforms'; COMPONENT='' ;;
            competitions)
              URL='https://github.com/xdecaro/competitions/releases/download/v1.1.0/pkg_xdecarocompetitions_1.1.0.zip'; SHA='6a84af789c87da646e4141786bd8226051571289017ecd482b1b31cdcf457cb0'; MODE='optional'; PACKAGE='pkg_xdecarocompetitions'; COMPONENT='' ;;
            documents)
              URL='https://github.com/xdecaro/documents/releases/download/v1.2.2/pkg_decarodocuments_1.2.2.zip'; SHA='0b82aef86ffd094cc2453e129e285bfb6274d08c930453a519fbf876e641114f'; MODE='hard'; PACKAGE='pkg_decarodocuments'; COMPONENT='com_decarodocuments' ;;
            membership)
              URL='https://github.com/xdecaro/membership/releases/download/v1.2.0/pkg_decaromembership_1.2.0.zip'; SHA='ab2eabfa6d248b7d5f03a786d0d1fd62ba7f71802b5fa646a1c080a23decfa7f'; MODE='optional'; PACKAGE='pkg_decaromembership'; COMPONENT='' ;;
            events)
              URL='https://github.com/xdecaro/events/releases/download/v1.1.2/pkg_decaroevents_1.1.2.zip'; SHA='29ebb4b89d3e8adff24cd3f1a38477b8371aadeb58c53468d7d91e1170c60ecb'; MODE='hard'; PACKAGE='pkg_decaroevents'; COMPONENT='com_decaroevents' ;;
            editor)
              URL='https://github.com/xdecaro/editor/releases/download/v0.1.0-alpha5/pkg_decaroeditor_0.1.0-alpha5.zip'; SHA='65dd999dd11b98b55f2ccc70d74b194221a7429bb9ac165e1f325d4ba2c984da'; MODE='optional'; PACKAGE='pkg_decaroeditor'; COMPONENT='' ;;
            finance)
              URL='https://github.com/xdecaro/finance/releases/download/v1.1.0/pkg_decarofinance_1.1.0.zip'; SHA='268ce39810135191dc95cd70f9f46847425fe37b6212f5897cf205d5fd7e0c84'; MODE='optional'; PACKAGE='pkg_decarofinance'; COMPONENT='' ;;
            protocol)
              URL='https://github.com/xdecaro/protocol/releases/download/v1.3.0/pkg_decaroprotocol_1.3.0.zip'; SHA='3dbf32cb15ba0f5993ecc56f883e720653945cca7159233330e54b81bb0236b4'; MODE='optional'; PACKAGE='pkg_decaroprotocol'; COMPONENT='' ;;
            *) echo "Unknown product: $PRODUCT" >&2; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "component=$COMPONENT" >> "$GITHUB_OUTPUT"
          curl --fail --location --retry 3 "$URL" --output /tmp/product.zip
          echo "${SHA}  /tmp/product.zip" | sha256sum --check --strict
          curl --fail --location --retry 3 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' --output /tmp/core.zip
          echo '4248f7e3de514c2ae2402ffc8ba12845647dca1ebac963da370650e88ac45def  /tmp/core.zip' | sha256sum --check --strict
          unzip -t /tmp/product.zip >/dev/null
          unzip -t /tmp/core.zip >/dev/null

      - name: Verify optional and hard dependency installation behavior
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          MODE='${{ steps.product.outputs.mode }}'
          PRODUCT='${{ matrix.product }}'
          PACKAGE='${{ steps.product.outputs.package }}'
          COMPONENT='${{ steps.product.outputs.component }}'

          extension_count() {
            php -r '
              $db = new mysqli("127.0.0.1", "root", "root", "joomla");
              if ($db->connect_errno) { fwrite(STDERR, $db->connect_error . PHP_EOL); exit(2); }
              $stmt = $db->prepare("SELECT COUNT(*) FROM jos_extensions WHERE element = ?");
              $stmt->bind_param("s", $argv[1]);
              $stmt->execute();
              $stmt->bind_result($count);
              $stmt->fetch();
              echo (int) $count;
            ' "$1"
          }

          if [ "$MODE" = 'core' ]; then
            php cli/joomla.php extension:install --path=/tmp/core.zip
            test "$(extension_count "$PACKAGE")" -eq 1
          elif [ "$MODE" = 'optional' ]; then
            php cli/joomla.php extension:install --path=/tmp/product.zip
            test "$(extension_count "$PACKAGE")" -eq 1
            php cli/joomla.php extension:list >/tmp/extensions-without-core.txt
            php cli/joomla.php extension:install --path=/tmp/core.zip
          elif [ "$MODE" = 'hard' ]; then
            set +e
            php cli/joomla.php extension:install --path=/tmp/product.zip >/tmp/hard-before-core.log 2>&1
            STATUS=$?
            set -e
            echo "Pre-Core CLI status for $PRODUCT: $STATUS"
            cat /tmp/hard-before-core.log

            if [ "$(extension_count "$PACKAGE")" -ne 0 ]; then
              echo "$PRODUCT package was registered without Core." >&2
              exit 1
            fi
            if [ -n "$COMPONENT" ] && [ "$(extension_count "$COMPONENT")" -ne 0 ]; then
              echo "$PRODUCT component was partially registered without Core." >&2
              exit 1
            fi
            if [ -n "$COMPONENT" ] && [ -d "administrator/components/$COMPONENT" ]; then
              echo "$PRODUCT component files were partially installed without Core." >&2
              exit 1
            fi

            php cli/joomla.php extension:install --path=/tmp/core.zip
            php cli/joomla.php extension:install --path=/tmp/product.zip
            test "$(extension_count "$PACKAGE")" -eq 1
            if [ -n "$COMPONENT" ]; then
              test "$(extension_count "$COMPONENT")" -eq 1
            fi
          else
            echo "Unknown Core mode: $MODE" >&2
            exit 1
          fi

          test "$(extension_count pkg_xdecarocore)" -eq 1
          php cli/joomla.php extension:list >/tmp/extensions-final.txt

      - name: Probe canonical Core runtime through Joomla namespace map
        shell: bash
        run: |
          set -euo pipefail
          cd joomla
          cat > core-probe.php <<'PHP'
          <?php
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';

          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get(\Joomla\Console\Application::class);
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();

          if (!class_exists(\xdecaro\Core\Version::class)) {
              fwrite(STDERR, "Canonical Core Version class is not autoloadable through Joomla.\n");
              exit(1);
          }
          if (version_compare((string) \xdecaro\Core\Version::VERSION, '1.4.0', '<')) {
              fwrite(STDERR, "Unexpected Core version.\n");
              exit(1);
          }
          if (!class_exists(\xdecaro\Core\Integration\CapabilityRegistry::class)) {
              fwrite(STDERR, "CapabilityRegistry is not autoloadable through Joomla.\n");
              exit(1);
          }
          echo 'Core runtime ' . \xdecaro\Core\Version::VERSION . " OK\n";
          PHP
          php core-probe.php
          rm core-probe.php

  core-upgrade:
    name: Joomla ${{ matrix.joomla }} / Core 1.3.0 -> 1.4.0
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    strategy:
      fail-fast: false
      matrix:
        joomla: ['5.4.8', '6.1.3']
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ startsWith(matrix.joomla, '6.') && '8.3' || '8.1' }}
          extensions: mysqli, zip, intl, mbstring, gd
          coverage: none
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip curl
      - name: Download verify and install pinned Joomla
        shell: bash
        run: |
          set -euo pipefail
          JOOMLA='${{ matrix.joomla }}'
          case "$JOOMLA" in
            5.4.8) SHA='8d3585939bca8e6b1d5f3e97dda2cc557c61e610daf488c871e1f62a97be9bd0' ;;
            6.1.3) SHA='a49305652503f9344d046d55471f324a07882996132ed967c3b0fe34707ae4a1' ;;
            *) exit 1 ;;
          esac
          FILE="Joomla_${JOOMLA}-Stable-Full_Package.zip"
          curl --fail --location --retry 3 "https://github.com/joomla/joomla-cms/releases/download/${JOOMLA}/${FILE}" --output /tmp/joomla.zip
          echo "${SHA}  /tmp/joomla.zip" | sha256sum --check --strict
          mkdir joomla
          unzip -q /tmp/joomla.zip -d joomla
          cd joomla
          php installation/joomla.php install --site-name='Core Upgrade Smoke' --admin-user='Runtime Admin' --admin-username='runtimeadmin' --admin-password='Runtime-Only-12345!' --admin-email='runtime@example.invalid' --db-type='mysqli' --db-host='127.0.0.1' --db-user='root' --db-pass='root' --db-name='joomla' --db-prefix='jos_'

      - name: Install old then current Core and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/xdecaro/core/releases/download/v1.3.0/pkg_xdecarocore_1.3.0.zip' --output /tmp/core-1.3.0.zip
          echo '85da967c34353e1b33af6f3dadd937118c172097f82cd3677966d567493a68e8  /tmp/core-1.3.0.zip' | sha256sum --check --strict
          curl --fail --location --retry 3 'https://github.com/xdecaro/core/releases/download/v1.4.0/pkg_xdecarocore_1.4.0.zip' --output /tmp/core-1.4.0.zip
          echo '4248f7e3de514c2ae2402ffc8ba12845647dca1ebac963da370650e88ac45def  /tmp/core-1.4.0.zip' | sha256sum --check --strict
          cd joomla
          php cli/joomla.php extension:install --path=/tmp/core-1.3.0.zip
          php cli/joomla.php extension:install --path=/tmp/core-1.4.0.zip
          php cli/joomla.php extension:list >/tmp/core-upgrade-final.txt

          php -r '
            $db = new mysqli("127.0.0.1", "root", "root", "joomla");
            if ($db->connect_errno) { fwrite(STDERR, $db->connect_error . PHP_EOL); exit(2); }
            $stmt = $db->prepare("SELECT manifest_cache FROM jos_extensions WHERE type = ? AND element = ? LIMIT 1");
            $type = "package";
            $element = "pkg_xdecarocore";
            $stmt->bind_param("ss", $type, $element);
            $stmt->execute();
            $stmt->bind_result($cache);
            if (!$stmt->fetch()) { fwrite(STDERR, "Core package is not registered after upgrade.\n"); exit(1); }
            $manifest = json_decode((string) $cache, true);
            if (!is_array($manifest) || ($manifest["version"] ?? "") !== "1.4.0") {
              fwrite(STDERR, "Core package manifest cache is not 1.4.0 after upgrade.\n");
              exit(1);
            }
          '

          cat > core-upgrade-probe.php <<'PHP'
          <?php
          define('_JEXEC', 1);
          define('JPATH_BASE', __DIR__);
          require JPATH_BASE . '/includes/defines.php';
          require JPATH_BASE . '/includes/framework.php';
          $container = \Joomla\CMS\Factory::getContainer();
          $container->alias('session', 'session.cli')
              ->alias('JSession', 'session.cli')
              ->alias(\Joomla\CMS\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\Session::class, 'session.cli')
              ->alias(\Joomla\Session\SessionInterface::class, 'session.cli');
          $app = $container->get(\Joomla\Console\Application::class);
          \Joomla\CMS\Factory::$application = $app;
          $app->createExtensionNamespaceMap();
          if (!class_exists(\xdecaro\Core\Version::class) || (string) \xdecaro\Core\Version::VERSION !== '1.4.0') {
              fwrite(STDERR, "Core 1.4.0 is not autoloadable after upgrade.\n");
              exit(1);
          }
          if (!class_exists(\xdecaro\Core\Integration\CapabilityRegistry::class)) {
              fwrite(STDERR, "CapabilityRegistry is not autoloadable after upgrade.\n");
              exit(1);
          }
          echo "Core upgrade runtime OK\n";
          PHP
          php core-upgrade-probe.php
          rm core-upgrade-probe.php
