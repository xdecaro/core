name: Ecosystem Core namespace audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  consumer-audit:
    name: ${{ matrix.repository }} runtime namespace audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # draw is private and is guarded by its own repository CI.
        repository:
          - courses
          - forms
          - competitions
          - documents
          - membership
          - events
          - editor
          - finance
          - protocol
          - organizations
          - people
          - resources
          - inventory
          - notifications
          - tasks
          - analytics
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v4
        with:
          repository: xdecaro/${{ matrix.repository }}
          path: consumer

      - name: Reject retired Core 1.x namespace in runtime PHP
        shell: bash
        run: |
          set -euo pipefail
          cd consumer
          MATCHES="$(grep -RInF 'Xdecaro\Core' . \
            --include='*.php' \
            --exclude-dir=.git \
            --exclude-dir=vendor \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude-dir=tests \
            --exclude-dir=docs \
            --exclude-dir=tools \
            || true)"
          if [ -n "$MATCHES" ]; then
            printf '%s\n' "$MATCHES"
            echo 'Retired Xdecaro\Core usage remains in consumer runtime PHP.' >&2
            exit 1
          fi

  core-boundary:
    name: Core 2.x namespace boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical Core 2.x source only
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<namespace path="src">xdecaro\Core</namespace>' src/lib_xdecarocore/xdecarocore.xml
          grep -Fq '<namespace path="src">xdecaro\Plugin\System\Core</namespace>' src/plg_system_xdecarocore/xdecarocore.xml
          test ! -e src/lib_xdecarocorelegacy
          test ! -e src/plg_system_xdecarocore/src/Extension/XdecaroCore.php
          test -f src/plg_system_xdecarocore/src/Extension/CorePlugin.php
          ! grep -RInE '^namespace Xdecaro\\Core' src
          ! grep -RInF 'Xdecaro\Core' src/lib_xdecarocore/src --include='*.php'
          ! grep -RInF 'xdecaro\Plugin\System\XdecaroCore' src --include='*.php' --include='*.xml'
          grep -RInE '^namespace xdecaro\\Core' src/lib_xdecarocore/src >/dev/null
