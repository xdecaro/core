name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PHP ${{ matrix.php }} validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: simplexml
          coverage: none

      - name: Build and validate
        run: bash build/build.sh

      - name: Inspect package contents
        run: |
          unzip -l dist/pkg_xdecarocore_1.0.0.zip
          unzip -l dist/lib_xdecarocore_1.0.0.zip
          unzip -l dist/plg_system_xdecarocore_1.0.0.zip
