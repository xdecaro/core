name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PHP 8.3 / Joomla 6.1.3 source validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml
          coverage: none

      - name: Guard Core 2.2 stabilization series
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SERIES="$(tr -d '[:space:]' < STABILIZATION_SERIES)"
          test "$VERSION" = '2.2.0'
          test "$SERIES" = '2.2'

      - name: Guard Core namespaces, package and platform
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<namespace path="src">xdecaro\Core</namespace>' src/lib_xdecarocore/xdecarocore.xml
          grep -Fq '<namespace path="src">xdecaro\Component\Core</namespace>' src/com_xdecarocore/xdecarocore.xml
          grep -Fq '<namespace path="src">xdecaro\Plugin\System\Core</namespace>' src/plg_system_xdecarocore/xdecarocore.xml
          for manifest in src/lib_xdecarocore/xdecarocore.xml src/com_xdecarocore/xdecarocore.xml src/plg_system_xdecarocore/xdecarocore.xml package/pkg_core/pkg_core.xml; do
            grep -Fq '<targetplatform name="joomla" version="6.1.3"' "$manifest"
          done
          grep -Fq '<packagename>core</packagename>' package/pkg_core/pkg_core.xml
          test ! -e src/lib_xdecarocorelegacy
          test ! -e src/plg_system_xdecarocore/src/Extension/XdecaroCore.php
          test -f src/plg_system_xdecarocore/src/Extension/CorePlugin.php
          ! grep -RInE '^namespace Xdecaro\\Core' src package tests

      - name: Run shared UI contracts
        run: |
          php tests/core-2.2-admin-ui-contract.php
          php tests/core-2.2-dashboard-shared-ui.php
          php tests/core-2.2-release-readiness.php

      - name: Build and validate
        run: bash build/build.sh

      - name: Verify deterministic build
        shell: bash
        run: |
          set -euo pipefail
          cp dist/SHA256SUMS.txt /tmp/core-first-sha256.txt
          bash build/build.sh >/tmp/core-second-build.txt
          cmp /tmp/core-first-sha256.txt dist/SHA256SUMS.txt

      - name: Inspect Core 2.2 package contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          version = '2.2.0'
          package = Path(f'dist/pkg_core_{version}.zip')
          plugin = Path(f'dist/plg_system_xdecarocore_{version}.zip')
          with zipfile.ZipFile(package) as z:
              expected = {'pkg_core.xml','script.php','lib_xdecarocore.zip','com_xdecarocore.zip','plg_system_xdecarocore.zip'}
              if set(z.namelist()) != expected:
                  raise SystemExit('Unexpected Core 2.2 package contents')
          with zipfile.ZipFile(plugin) as z:
              required = {'media/css/core.css','media/css/components.css','media/css/admin.css','media/joomla.asset.json'}
              missing = required.difference(z.namelist())
              if missing:
                  raise SystemExit(f'Missing shared UI package members: {sorted(missing)}')
          PY

      - name: Upload verified Core packages
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ github.sha }}
          path: |
            dist/pkg_core_*.zip
            dist/lib_xdecarocore_*.zip
            dist/com_xdecarocore_*.zip
            dist/plg_system_xdecarocore_*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
