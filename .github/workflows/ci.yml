name: Core CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PHP 8.3 / Joomla 6.1.3 source validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: simplexml
          coverage: none

      - name: Verify Core 2.2 shared admin UI contract
        run: php tests/core-2.2-admin-ui-contract.php

      - name: Verify Core 2.2 release readiness contract
        run: php tests/core-2.2-release-readiness.php

      - name: Verify Core 2.2 upgrade cleanup contract
        run: php tests/core-2.2-upgrade-cleanup.php

      - name: Guard Core 2.2 stabilization series
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SERIES="$(tr -d '[:space:]' < STABILIZATION_SERIES)"
          test -n "$VERSION"
          test "$SERIES" = '2.2'
          case "$VERSION" in
            2.2.*) ;;
            *)
              echo "Core ${VERSION} is outside the 2.2.x stabilization line." >&2
              exit 1
              ;;
          esac

      - name: Guard Core 2.x namespace and package shape
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<namespace path="src">xdecaro\Core</namespace>' src/lib_xdecarocore/xdecarocore.xml
          grep -Fq '<namespace path="src">xdecaro\Component\Core</namespace>' src/com_xdecarocore/xdecarocore.xml
          grep -Fq '<namespace path="src">xdecaro\Plugin\System\Core</namespace>' src/plg_system_xdecarocore/xdecarocore.xml
          grep -Fq '<targetplatform name="joomla" version="6.1.3"' src/lib_xdecarocore/xdecarocore.xml
          grep -Fq '<targetplatform name="joomla" version="6.1.3"' src/com_xdecarocore/xdecarocore.xml
          grep -Fq '<targetplatform name="joomla" version="6.1.3"' src/plg_system_xdecarocore/xdecarocore.xml
          grep -Fq '<targetplatform name="joomla" version="6.1.3"' package/pkg_core/pkg_core.xml
          test ! -e src/lib_xdecarocorelegacy
          test ! -e src/plg_system_xdecarocore/src/Extension/XdecaroCore.php
          test -f src/plg_system_xdecarocore/src/Extension/CorePlugin.php
          ! grep -RInE '^namespace Xdecaro\\Core' src package tests

      - name: Build and validate
        run: bash build/build.sh

      - name: Verify deterministic build
        shell: bash
        run: |
          set -euo pipefail
          cp dist/SHA256SUMS.txt /tmp/core-first-sha256.txt
          bash build/build.sh >/tmp/core-second-build.txt
          cmp /tmp/core-first-sha256.txt dist/SHA256SUMS.txt

      - name: Inspect Core 2.x package contents
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          python3 - "$VERSION" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          version = sys.argv[1]
          names = (
              f"dist/pkg_core_{version}.zip",
              f"dist/lib_xdecarocore_{version}.zip",
              f"dist/com_xdecarocore_{version}.zip",
              f"dist/plg_system_xdecarocore_{version}.zip",
          )
          for name in names:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"Missing {path}")
              with zipfile.ZipFile(path) as archive:
                  if archive.testzip():
                      raise SystemExit(f"Corrupt archive: {path}")

          with zipfile.ZipFile(names[0]) as package:
              expected = {
                  'pkg_core.xml',
                  'script.php',
                  'lib_xdecarocore.zip',
                  'com_xdecarocore.zip',
                  'plg_system_xdecarocore.zip',
              }
              if set(package.namelist()) != expected:
                  raise SystemExit('Unexpected Core 2.x package contents')

          with zipfile.ZipFile(names[1]) as library:
              for required in (
                  'src/Location/LocationProviderInterface.php',
                  'src/Location/LocationResult.php',
                  'src/Location/OpenMeteoLocationProvider.php',
                  'src/Location/WorldLocationService.php',
              ):
                  if required not in library.namelist():
                      raise SystemExit(f'Missing world location contract: {required}')

          with zipfile.ZipFile(names[3]) as plugin:
              for required in ('media/joomla.asset.json', 'media/css/core.css', 'media/css/components.css', 'media/css/admin.css'):
                  if required not in plugin.namelist():
                      raise SystemExit(f'Missing shared admin UI package member: {required}')
          PY

      - name: Upload verified Core packages
        uses: actions/upload-artifact@v4
        with:
          name: core-${{ github.sha }}
          path: |
            dist/pkg_core_*.zip
            dist/lib_xdecarocore_*.zip
            dist/com_xdecarocore_*.zip
            dist/plg_system_xdecarocore_*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
