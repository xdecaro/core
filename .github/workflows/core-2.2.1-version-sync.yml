name: Core 2.2.1 version sync

on:
  push:
    branches:
      - feat/core-2.2.1-ui-refinement
    paths:
      - .github/workflows/core-2.2.1-version-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-2.2.1-ui-refinement
      - name: Synchronize 2.2.1 metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              'src/com_xdecarocore/xdecarocore.xml',
              'src/lib_xdecarocore/xdecarocore.xml',
              'src/plg_system_xdecarocore/xdecarocore.xml',
              'package/pkg_core/pkg_core.xml',
              'src/lib_xdecarocore/src/Version.php',
              'src/plg_system_xdecarocore/media/joomla.asset.json',
              'src/com_xdecarocore/media/joomla.asset.json',
              'src/com_xdecarocore/admin/src/Service/EcosystemService.php',
              'tests/core-2.2-release-readiness.php',
              'updates/pkg_core.xml',
          ]
          for name in paths:
              p = Path(name)
              text = p.read_text()
              text = text.replace('2.2.0', '2.2.1')
              p.write_text(text)
          PY
      - name: Commit synchronized metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package tests updates VERSION
          git diff --cached --quiet && exit 0
          git commit -m "chore: synchronize Core 2.2.1 metadata"
          git push origin HEAD:feat/core-2.2.1-ui-refinement
