name: Core 2.2.1 contract sync

on:
  push:
    branches:
      - feat/core-2.2.1-ui-refinement
    paths:
      - .github/workflows/core-2.2.1-version-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/core-2.2.1-ui-refinement
      - name: Synchronize dashboard catalog contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/dashboard.php')
          s = p.read_text()
          old = "'core' => ['pkg_core', '2.2.0']"
          new = "'core' => ['pkg_core', '2.2.1']"
          if old not in s:
              raise SystemExit('Expected Core 2.2.0 dashboard assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit synchronized contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/dashboard.php
          git diff --cached --quiet && exit 0
          git commit -m "test: align dashboard catalog with Core 2.2.1"
          git push origin HEAD:feat/core-2.2.1-ui-refinement
